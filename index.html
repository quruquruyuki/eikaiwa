<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="英会話">
<meta name="theme-color" content="#ffffff">
<title>英会話</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
  :root { --fg:#37352f; --sub:#787774; --line:#e9e9e7; --bg:#fff; --soft:#f7f6f3; --red:#e03e3e; --blue:#2383e2; --green:#2b8a57;
    --okbg:#dbeddb; --ngbg:#ffe2dd; --bluebg:#e7f0fb; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif; color:var(--fg); background:var(--bg); font-size:16px; }
  header { position:sticky; top:0; background:rgba(255,255,255,.95); backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 10px) 16px 10px; display:flex; align-items:center; gap:8px; z-index:5; }
  header h1 { font-size:18px; margin:0; flex:1; }
  button { font:inherit; color:inherit; background:none; border:1px solid var(--line); border-radius:8px; padding:8px 12px; cursor:pointer; }
  button.primary { background:var(--fg); color:#fff; border-color:var(--fg); }
  button.blue { background:var(--blue); color:#fff; border-color:var(--blue); }
  button:disabled { opacity:.4; }
  button.sm { padding:4px 9px; font-size:13px; }
  .icon { border:none; font-size:20px; padding:6px 8px; }
  main { padding:16px; padding-bottom:calc(env(safe-area-inset-bottom) + 90px); max-width:720px; margin:0 auto; }
  nav.tabs { position:fixed; left:0; right:0; bottom:0; background:rgba(255,255,255,.97); backdrop-filter:blur(8px); border-top:1px solid var(--line);
    display:flex; padding:6px 4px calc(env(safe-area-inset-bottom) + 6px); z-index:6; }
  nav.tabs button { flex:1; border:none; padding:4px 0; font-size:10px; color:var(--sub); display:flex; flex-direction:column; align-items:center; gap:2px; }
  nav.tabs button b { font-size:20px; font-weight:400; line-height:1.1; }
  nav.tabs button.on { color:var(--fg); font-weight:600; }
  .hint { color:var(--sub); font-size:13px; line-height:1.6; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .row.c { justify-content:center; }
  .grow { flex:1; }
  label { display:block; font-size:13px; color:var(--sub); margin:14px 0 4px; }
  input, select, textarea { width:100%; font:inherit; color:inherit; border:1px solid var(--line); border-radius:8px; padding:10px; background:#fff; }
  textarea { min-height:80px; line-height:1.6; resize:vertical; }
  h2 { font-size:16px; margin:22px 0 8px; }
  h2:first-child { margin-top:4px; }
  .card { background:var(--soft); border-radius:12px; padding:14px; margin-top:10px; }
  .hidden { display:none !important; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { border:1px solid var(--line); border-radius:20px; padding:8px 14px; font-size:14px; background:#fff; }
  .chip.on { background:var(--fg); color:#fff; border-color:var(--fg); }
  .seg2 { display:inline-flex; background:var(--soft); border-radius:9px; padding:3px; }
  .seg2 button { border:none; border-radius:7px; padding:6px 14px; color:var(--sub); font-size:14px; }
  .seg2 button.on { background:#fff; color:var(--fg); box-shadow:0 1px 2px rgba(0,0,0,.12); font-weight:600; }
  .seg2.lv { display:flex; } .seg2.lv button { flex:1; padding:7px 4px; }
  .task { display:flex; gap:12px; align-items:center; padding:14px 12px; border:1px solid var(--line); border-radius:12px; margin-top:10px; background:#fff; width:100%; text-align:left; }
  .task .n { width:28px; height:28px; border-radius:50%; background:var(--soft); display:flex; align-items:center; justify-content:center; font-size:14px; flex:none; }
  .task.done { background:var(--soft); } .task.done .n { background:var(--green); color:#fff; }
  .task .t { flex:1; } .task .t b { display:block; } .task .t small { color:var(--sub); font-size:13px; }
  .stage { font-size:13px; color:var(--sub); margin:18px 0 4px; font-weight:600; }
  .wk { display:flex; gap:10px; padding:10px 4px; border-bottom:1px solid var(--line); align-items:center; }
  .wk.cur { background:var(--bluebg); border-radius:8px; }
  .wk .no { width:44px; color:var(--sub); font-size:13px; flex:none; }
  .qopt { display:flex; gap:10px; align-items:center; width:100%; text-align:left; padding:12px; margin-top:8px; border-radius:10px; }
  .qopt.ok { background:var(--okbg); border-color:#9ccfab; } .qopt.ng { background:var(--ngbg); border-color:#f0b4ab; }
  .backbar { background:var(--bluebg); border-radius:10px; padding:10px 12px; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
  .tag { font-size:12px; padding:2px 8px; border-radius:4px; background:var(--soft); color:var(--sub); white-space:nowrap; }
  .tag.ok { background:var(--okbg); color:#2b593f; } .tag.ng { background:var(--ngbg); color:#5d1715; } .tag.b { background:var(--bluebg); color:#1f5aa6; }

  /* 会話 */
  #chatLog { display:flex; flex-direction:column; gap:10px; padding-bottom:180px; }
  .bub { max-width:86%; padding:10px 12px; border-radius:14px; line-height:1.55; }
  .bub.ai { background:var(--soft); align-self:flex-start; border-bottom-left-radius:4px; }
  .bub.me { background:var(--bluebg); align-self:flex-end; border-bottom-right-radius:4px; }
  .bub .ja { color:var(--sub); font-size:14px; margin-top:6px; border-top:1px dashed var(--line); padding-top:6px; }
  .bub .tools { display:flex; gap:6px; margin-top:6px; }
  .bub .tools button { padding:2px 8px; font-size:12px; background:#fff; }
  .bub.hintb { background:#fff8e6; align-self:stretch; max-width:100%; font-size:14px; }
  .dock { position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom) + 58px); background:rgba(255,255,255,.97); border-top:1px solid var(--line);
    padding:10px 16px; z-index:5; }
  .dock .inner { max-width:720px; margin:0 auto; }
  .mic { width:72px; height:72px; border-radius:50%; border:4px solid var(--line); background:#fff; display:inline-flex; align-items:center; justify-content:center; padding:0; flex:none; }
  .mic span { width:44px; height:44px; border-radius:50%; background:var(--red); transition:.2s; }
  .mic.on span { width:26px; height:26px; border-radius:6px; }
  .mic.busy span { background:var(--sub); animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.3; } }
  .status { font-size:13px; color:var(--sub); text-align:center; min-height:18px; margin-top:4px; }

  /* 練習カード */
  .sent { font-size:20px; line-height:1.6; margin:6px 0; }
  .sent.blur { filter:blur(7px); user-select:none; }
  .ja2 { color:var(--sub); font-size:14px; line-height:1.6; }
  .diff { font-size:18px; line-height:1.9; }
  .diff .ok { color:var(--green); }
  .diff .miss { color:var(--red); text-decoration:underline; text-decoration-style:wavy; text-underline-offset:4px; }
  .diff .extra { color:var(--sub); text-decoration:line-through; }
  .big { font-size:40px; font-weight:700; font-variant-numeric:tabular-nums; }
  .progress { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin:8px 0 4px; }
  .progress div { height:100%; background:var(--blue); width:0; transition:.3s; }
  .player { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; }
  .player button { flex:1; min-width:90px; padding:12px 8px; }

  .item { padding:12px 2px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:flex-start; }
  .item .t { flex:1; min-width:0; }
  .item .t b { display:block; font-weight:600; line-height:1.45; }
  .item .t small { color:var(--sub); line-height:1.5; display:block; margin-top:2px; }
  .corr { background:#fff; border-radius:10px; padding:10px 12px; margin-top:8px; border:1px solid var(--line); }
  .corr .said { color:var(--sub); text-decoration:line-through; text-decoration-color:#e0a09b; }
  .corr .better { font-weight:600; margin:4px 0; }

  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .stat { background:var(--soft); border-radius:10px; padding:12px 8px; text-align:center; }
  .stat b { display:block; font-size:24px; font-variant-numeric:tabular-nums; }
  .stat small { color:var(--sub); font-size:12px; }
  .heat { display:grid; grid-template-rows:repeat(7,1fr); grid-auto-flow:column; gap:3px; margin-top:8px; }
  .heat i { width:100%; aspect-ratio:1; border-radius:3px; background:var(--line); display:block; }
  .heat i.l1 { background:#b7dcc4; } .heat i.l2 { background:#6fbf8e; } .heat i.l3 { background:#2b8a57; }
  .heat i.today { outline:2px solid var(--fg); outline-offset:-1px; }

  dialog { border:none; border-radius:14px; padding:0; width:min(92vw,520px); max-height:86vh; }
  dialog::backdrop { background:rgba(0,0,0,.3); }
  .dlg { padding:16px 18px 20px; overflow:auto; max-height:86vh; }
  .dlg h3 { margin:0 0 6px; font-size:17px; }
  .toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 150px); transform:translateX(-50%); background:var(--fg); color:#fff;
    padding:10px 16px; border-radius:10px; font-size:14px; opacity:0; transition:.3s; pointer-events:none; max-width:90vw; z-index:30; }
  .toast.show { opacity:1; }
  .flash { text-align:center; padding:24px 8px; }
  .flash .q { font-size:18px; line-height:1.6; }
  .flash .a { font-size:20px; font-weight:600; line-height:1.6; margin-top:14px; }
</style>
</head>
<body>

<!-- ログイン -->
<section id="v-login" class="hidden">
  <header><h1>英会話</h1></header>
  <main>
    <p class="hint">ほかのアプリと同じアカウントでログインします。</p>
    <form id="loginForm">
      <label>メールアドレス</label><input id="lEmail" type="email" autocomplete="username" required>
      <label>パスワード</label><input id="lPass" type="password" autocomplete="current-password" required>
      <div class="row" style="margin-top:16px"><button id="lBtn" class="primary grow">ログイン</button></div>
      <p id="lMsg" class="hint" style="color:var(--red)"></p>
    </form>
  </main>
</section>

<!-- 今日（カリキュラム） -->
<section id="v-today" class="hidden">
  <header><h1>今日のレッスン</h1><button class="sm" id="cOpenList">カリキュラム</button><button class="icon" data-settings>⚙︎</button></header>
  <main>
    <div id="todayBox"></div>
    <div id="pointBox" class="hidden"></div>
    <div id="quizBox" class="hidden"></div>
  </main>
</section>

<!-- 会話 -->
<section id="v-talk" class="hidden">
  <header><h1 id="talkTitle">会話</h1><button id="talkEnd" class="sm hidden">終了して添削</button><button class="icon" data-settings>⚙︎</button></header>
  <main>
    <div id="talkSetup">
      <h2>場面をえらぶ</h2>
      <div class="chips" id="sceneChips" data-scenebox></div>
      <div id="sceneCustomBox" class="hidden">
        <label>どんな場面？（日本語でOK）</label>
        <textarea id="sceneCustom" placeholder="例：海外の学会でポスター発表を見に来た医師に、研究内容を説明する"></textarea>
      </div>
      <p class="hint" id="sceneDesc" style="margin-top:10px"></p>
      <h2>レベル</h2>
      <div id="talkLevel" data-levelbox></div>
      <div class="row" style="margin-top:14px"><button id="talkStart" class="primary grow" style="padding:12px">会話をはじめる</button></div>
      <p class="hint">マイクのボタンを押して話し、もう一度押すと送信されます。会話中は直さず、終わったあとにまとめて添削します。</p>
    </div>
    <div id="talkRoom" class="hidden"><div id="chatLog"></div></div>
    <div id="talkReview" class="hidden"></div>
  </main>
  <div class="dock hidden" id="talkDock"><div class="inner">
    <div class="row" id="dockVoice">
      <button id="hintBtn" class="sm">💡 ヒント</button>
      <div class="grow" style="text-align:center"><button class="mic" id="talkMic"><span></span></button></div>
      <button id="kbBtn" class="sm">⌨︎ 文字</button>
    </div>
    <div class="row hidden" id="dockText">
      <input id="talkText" class="grow" placeholder="英語で入力" autocapitalize="sentences" autocomplete="off">
      <button id="talkSend" class="primary">送信</button>
      <button id="micBack" class="sm">🎤</button>
    </div>
    <div class="status" id="talkStatus"></div>
  </div></div>
</section>

<!-- ディクテーション -->
<section id="v-dict" class="hidden">
  <header><h1>ディクテーション</h1><button class="sm hidden" id="dictQuit">やめる</button><button class="icon" data-settings>⚙︎</button></header>
  <main>
    <div id="dictPick"></div>
    <div id="dictRun" class="hidden">
      <div class="row"><span class="tag" id="dictPos"></span><span class="hint grow" id="dictTitle"></span></div>
      <div class="progress"><div id="dictBar"></div></div>
      <div class="player">
        <button id="dPlay" class="blue">▶ 再生</button>
        <button id="dSlow">🐢 ゆっくり</button>
      </div>
      <p class="hint" id="dCount"></p>
      <div id="dInputBox">
        <textarea id="dInput" placeholder="聞こえた英語を書く" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
        <p class="hint" id="dHintText"></p>
        <div class="row" style="margin-top:8px">
          <button id="dHint" class="sm">ヒント（頭文字）</button>
          <span class="grow"></span>
          <button id="dCheck" class="primary">答え合わせ</button>
        </div>
      </div>
      <div id="dResult" class="hidden card"></div>
    </div>
    <div id="dictDone" class="hidden"></div>
  </main>
</section>

<!-- シャドーイング -->
<section id="v-shad" class="hidden">
  <header><h1>シャドーイング</h1><button class="sm hidden" id="shadQuit">やめる</button><button class="icon" data-settings>⚙︎</button></header>
  <main>
    <div id="shadPick"></div>
    <div id="shadRun" class="hidden">
      <div class="row"><span class="tag" id="shadPos"></span><span class="hint grow" id="shadTitle"></span></div>
      <div class="progress"><div id="shadBar"></div></div>
      <div class="row" style="margin:10px 0">
        <div class="seg2" id="shadMode"><button data-m="repeat" class="on">リピート</button><button data-m="shadow">シャドーイング</button></div>
        <span class="grow"></span>
        <label style="margin:0;display:flex;gap:6px;align-items:center;color:var(--fg)"><input type="checkbox" id="shadHide" style="width:auto"> 英文を隠す</label>
      </div>
      <div class="card">
        <div class="sent" id="sEn"></div>
        <div class="ja2" id="sJa"></div>
      </div>
      <p class="hint" id="shadModeHint"></p>
      <div class="player">
        <button id="sListen">▶ お手本</button>
        <button id="sSlow">🐢 ゆっくり</button>
      </div>
      <div style="text-align:center;margin:8px 0">
        <button class="mic" id="sGo"><span></span></button>
        <div class="status" id="sStatus">押すとはじまります</div>
      </div>
      <div id="sResult" class="hidden card"></div>
    </div>
    <div id="shadDone" class="hidden"></div>
  </main>
</section>

<!-- フレーズ帳 -->
<section id="v-phr" class="hidden">
  <header><h1>フレーズ帳</h1><button class="sm" id="phrAdd">＋追加</button><button class="icon" data-settings>⚙︎</button></header>
  <main>
    <div id="phrHome">
      <div class="card row">
        <div class="grow"><b id="phrDueN">0</b> 件が今日の復習</div>
        <button class="primary" id="phrReview">復習する</button>
      </div>
      <div class="row" style="margin-top:14px">
        <div class="seg2" id="phrFilter"><button data-f="due" class="on">復習</button><button data-f="all">すべて</button></div>
        <span class="grow"></span>
        <button class="sm" id="phrToDict">聞き取り練習へ</button>
      </div>
      <div id="phrList"></div>
    </div>
    <div id="phrCard" class="hidden"></div>
  </main>
</section>

<!-- 記録 -->
<section id="v-log" class="hidden">
  <header><h1>記録</h1><button class="icon" data-settings>⚙︎</button></header>
  <main>
    <div class="stats">
      <div class="stat"><b id="stStreak">0</b><small>連続日数</small></div>
      <div class="stat"><b id="stWeek">0</b><small>今週の学習日</small></div>
      <div class="stat"><b id="stTotal">0</b><small>累計回数</small></div>
    </div>
    <h2>この12週間</h2>
    <div class="heat" id="heat"></div>
    <p class="hint">色が濃いほど、その日にたくさん練習しています。</p>
    <h2>最近の練習</h2>
    <div id="logList"></div>
  </main>
</section>

<nav class="tabs hidden" id="tabs">
  <button data-v="today" class="on"><b>📅</b>今日</button>
  <button data-v="talk"><b>💬</b>会話</button>
  <button data-v="dict"><b>✍︎</b>聞き取り</button>
  <button data-v="shad"><b>🗣</b>シャドー</button>
  <button data-v="phr"><b>📒</b>フレーズ</button>
  <button data-v="log"><b>📈</b>記録</button>
</nav>

<!-- 設定 -->
<dialog id="settings"><div class="dlg">
  <h3>設定</h3>
    <label>読み上げの声</label>
  <select id="sVoice">
    <option value="alloy">alloy（落ち着いた声）</option><option value="nova">nova（明るい女性）</option><option value="shimmer">shimmer（やわらかい女性）</option>
    <option value="coral">coral（女性）</option><option value="sage">sage（女性）</option><option value="echo">echo（男性）</option>
    <option value="onyx">onyx（低い男性）</option><option value="ash">ash（男性）</option><option value="fable">fable（イギリス風）</option>
    <option value="device">端末の声（無料・オフライン）</option>
  </select>
  <label>「ゆっくり」の速さ</label>
  <select id="sSlowRate"><option value="0.6">0.6倍</option><option value="0.7">0.7倍</option><option value="0.8">0.8倍</option></select>
  <label style="display:flex;gap:8px;align-items:center;color:var(--fg)"><input type="checkbox" id="sAuto" style="width:auto"> 会話でAIの返事を自動で読み上げる</label>
  <label style="display:flex;gap:8px;align-items:center;color:var(--fg)"><input type="checkbox" id="sShowJa" style="width:auto"> 会話で日本語訳を最初から表示する</label>
  <p class="hint" id="sCost" style="margin-top:14px"></p>
  <div class="row" style="margin-top:16px">
    <button id="sLogout" class="sm">ログアウト</button><span class="grow"></span>
    <button id="sClose">閉じる</button><button id="sSave" class="primary">保存</button>
  </div>
</div></dialog>

<!-- フレーズ追加 -->
<dialog id="addDlg"><div class="dlg">
  <h3>フレーズを追加</h3>
  <label>英語</label><textarea id="aEn" style="min-height:60px" autocapitalize="sentences"></textarea>
  <label>日本語</label><input id="aJa">
  <label>メモ（使いどころなど）</label><input id="aNote">
  <div class="row" style="margin-top:16px"><span class="grow"></span><button id="aClose">閉じる</button><button id="aSave" class="primary">追加</button></div>
</div></dialog>

<!-- カリキュラム一覧 -->
<dialog id="courseDlg"><div class="dlg" id="courseBody"></div></dialog>

<!-- 記録の詳細 -->
<dialog id="logDlg"><div class="dlg" id="logBody"></div></dialog>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ===== 基本 =====
const SB_URL = "https://oqtyorwlrnrcyjxiassg.supabase.co";
const sb = supabase.createClient(SB_URL, "sb_publishable_5KRsDfHG07lsUL7uUr6zpQ_2ehucxbJ");
const FN = SB_URL + "/functions/v1/eikaiwa";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const toast = (m, ms=2500) => { const t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"), ms); };
const today = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const dayOf = iso => { const d=new Date(iso); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const addDays = (ymd, n) => { const d=new Date(ymd+"T00:00:00"); d.setDate(d.getDate()+n); return dayOf(d); };
async function token() { const { data } = await sb.auth.getSession(); return data.session?.access_token; }

// サーバー（eikaiwa関数）を呼ぶ
async function api(action, body = {}) {
  const t = await token(); if (!t) { show("login"); throw new Error("ログインしてください"); }
  const r = await fetch(FN, { method:"POST", headers:{ Authorization:`Bearer ${t}`, "Content-Type":"application/json" }, body:JSON.stringify({ action, ...body }) });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) { show("login"); }
  if (!r.ok || d.error) throw new Error(d.error || `エラー（${r.status}）`);
  addCost(d.usd); return d;
}

const REC_MIME = ["audio/mp4","audio/webm;codecs=opus","audio/webm"].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || "";
let recState = null;
async function recStart() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true } });
  const rec = new MediaRecorder(stream, REC_MIME ? { mimeType:REC_MIME, audioBitsPerSecond:64000 } : {});
  const parts = []; rec.ondataavailable = e => e.data.size && parts.push(e.data);
  const done = new Promise(res => rec.onstop = () => {
    stream.getTracks().forEach(t => t.stop()); // マイクを離す（iPhoneで再生音が小さくなるのを防ぐ）
    res(new Blob(parts, { type: rec.mimeType || REC_MIME || "audio/mp4" }));
  });
  rec.start(); recState = { rec, done, at:Date.now() };
}
async function recStop() {
  if (!recState) return null;
  const { rec, done, at } = recState; recState = null;
  if (rec.state !== "inactive") rec.stop();
  const blob = await done; return { blob, seconds:(Date.now()-at)/1000 };
}
async function transcribe(rec, prompt = "") {
  if (!rec || rec.seconds < 0.6 || rec.blob.size < 1500) return "";
  const t = await token();
  const fd = new FormData();
  const ext = rec.blob.type.includes("webm") ? "webm" : "m4a";
  fd.append("file", rec.blob, "speech." + ext); fd.append("seconds", String(rec.seconds)); fd.append("prompt", prompt);
  const r = await fetch(FN, { method:"POST", headers:{ Authorization:`Bearer ${t}` }, body:fd });
  const d = await r.json().catch(() => ({}));
  if (!r.ok || d.error) throw new Error(d.error || `聞き取りエラー（${r.status}）`);
  addCost(d.usd); return d.text || "";
}

const player = new Audio(); player.preload = "auto"; player.playsInline = true;
let unlocked = false;
function silentWav() {
  const n = 800, b = new ArrayBuffer(44 + n*2), v = new DataView(b), w = (o,s) => [...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
  w(0,"RIFF"); v.setUint32(4,36+n*2,true); w(8,"WAVE"); w(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,8000,true); v.setUint32(28,16000,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,"data"); v.setUint32(40,n*2,true);
  return URL.createObjectURL(new Blob([b], { type:"audio/wav" }));
}
document.addEventListener("pointerdown", () => {
  if (unlocked) return; unlocked = true;
  player.src = silentWav(); player.play().catch(()=>{});
  try { speechSynthesis.speak(new SpeechSynthesisUtterance("")); } catch {}
}, { capture:true });

const ttsCache = new Map();
async function ttsUrl(text) {
  const key = S.voice + "|" + text;
  if (ttsCache.has(key)) return ttsCache.get(key);
  const p = api("tts", { text, voice:S.voice }).then(d => {
    const bin = atob(d.audio), u8 = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
    return URL.createObjectURL(new Blob([u8], { type:d.mime || "audio/mpeg" }));
  });
  ttsCache.set(key, p); p.catch(() => ttsCache.delete(key)); return p;
}
let playToken = 0;
function stopAudio() { playToken++; try { player.pause(); } catch {} try { speechSynthesis.cancel(); } catch {} }
// 文を読み上げる。読み終わったら resolve（rate=速さ）
async function speak(text, rate = 1) {
  stopAudio(); const my = playToken;
  if (S.voice !== "device") {
    try {
      const url = await ttsUrl(text); if (my !== playToken) return;
      player.src = url; player.playbackRate = rate; player.defaultPlaybackRate = rate;
      await new Promise((res, rej) => {
        player.onended = res; player.onerror = rej; player.onpause = () => my !== playToken && res();
        player.play().then(() => { player.playbackRate = rate; }).catch(rej);
      });
      return;
    } catch (e) { console.warn("AI読み上げに失敗、端末の声を使います", e); if (my !== playToken) return; }
  }
  await new Promise(res => {
    const u = new SpeechSynthesisUtterance(text); u.lang = "en-US"; u.rate = rate;
    const v = speechSynthesis.getVoices().find(v => v.lang === "en-US" && /Samantha|Alex|Ava|Allison/.test(v.name)) || speechSynthesis.getVoices().find(v => v.lang.startsWith("en"));
    if (v) u.voice = v; u.onend = res; u.onerror = res; speechSynthesis.speak(u);
  });
}
function playBlob(blob) { stopAudio(); player.src = URL.createObjectURL(blob); player.playbackRate = 1; return player.play().catch(()=>{}); }

// ===== 英文の比べ方（ディクテーション・シャドーイング共通） =====
const CONTR = { "i'm":"i am","you're":"you are","we're":"we are","they're":"they are","he's":"he is","she's":"she is","it's":"it is","that's":"that is",
  "there's":"there is","what's":"what is","let's":"let us","i've":"i have","you've":"you have","we've":"we have","they've":"they have","i'll":"i will",
  "you'll":"you will","we'll":"we will","they'll":"they will","it'll":"it will","i'd":"i would","you'd":"you would","we'd":"we would","don't":"do not",
  "doesn't":"does not","didn't":"did not","can't":"can not","cannot":"can not","won't":"will not","isn't":"is not","aren't":"are not","wasn't":"was not",
  "weren't":"were not","haven't":"have not","hasn't":"has not","wouldn't":"would not","shouldn't":"should not","couldn't":"could not","gonna":"going to","wanna":"want to" };
const NUM = ["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen","twenty"];
function norm(w) { return w.toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9'%-]/g,"").replace(/^'+|'+$/g,""); }
// 比べる用の単語列（短縮形・数字をそろえる）＋表示用の元の単語
function toks(s) {
  const out = [];
  for (const raw of String(s).replace(/[—–]/g," ").split(/\s+/)) {
    const n = norm(raw); if (!n) continue;
    const parts = (CONTR[n] || (/^\d+$/.test(n) && +n <= 20 ? NUM[+n] : n)).split(/[\s-]+/).filter(Boolean);
    parts.forEach((p, i) => out.push({ k:p, show: i === 0 ? raw : "" }));
  }
  return out;
}
// 正解と回答を並べて、合っている／抜けた／余分 を判定
function compare(ref, ans) {
  const a = toks(ref), b = toks(ans), n = a.length, m = b.length;
  const L = Array.from({ length:n+1 }, () => new Int16Array(m+1));
  for (let i=n-1;i>=0;i--) for (let j=m-1;j>=0;j--) L[i][j] = a[i].k === b[j].k ? L[i+1][j+1]+1 : Math.max(L[i+1][j], L[i][j+1]);
  const ops = []; let i=0, j=0;
  while (i<n && j<m) {
    if (a[i].k === b[j].k) { ops.push({ t:"ok", w:a[i] }); i++; j++; }
    else if (L[i+1][j] >= L[i][j+1]) { ops.push({ t:"miss", w:a[i] }); i++; }
    else { ops.push({ t:"extra", w:b[j] }); j++; }
  }
  while (i<n) ops.push({ t:"miss", w:a[i++] }); while (j<m) ops.push({ t:"extra", w:b[j++] });
  const score = n ? Math.round(L[0][0] / n * 100) : 0;
  // 表示：正解文の単語を「合っている／抜けた」で色分け、余分な語は取り消し線
  let html = "", prevRef = null;
  for (const o of ops) {
    if (o.t === "extra") { html += `<span class="extra">${esc(o.w.show || o.w.k)}</span> `; continue; }
    if (!o.w.show) { if (o.t === "miss" && prevRef === "ok") html = html.replace(/<span class="ok">([^<]*)<\/span> $/, '<span class="miss">$1</span> '); prevRef = o.t; continue; }
    html += `<span class="${o.t}">${esc(o.w.show)}</span> `; prevRef = o.t;
  }
  return { score, html, missed: ops.filter(o=>o.t==="miss").length };
}

$("sGo").onclick = async () => {

    } else {

async function finishShadTake() {

const MODE_JA = { conversation:"💬 会話", dictation:"✍︎ 聞き取り", shadowing:"🗣 シャドー", phrases:"📒 復習", quiz:"🎧 クイズ", lesson:"📅 レッスン" };
async function renderLog() {
  const since = addDays(today(), -7*12 - 7);
  const { data, error } = await sb.from("ek_sessions").select("id,created_at,mode,scene,minutes,score").gte("created_at", since + "T00:00:00").order("created_at", { ascending:false });
  if (error) return toast(error.message);
  const { count } = await sb.from("ek_sessions").select("id", { count:"exact", head:true });
  const byDay = {}; for (const s of data) { const k = dayOf(s.created_at); byDay[k] = (byDay[k]||0) + 1; }
  // 連続日数（今日まだなら昨日から数える）
  let d = today(), streak = 0; if (!byDay[d]) d = addDays(d, -1);
  while (byDay[d]) { streak++; d = addDays(d, -1); }
  const now = new Date(), mon = addDays(today(), -((now.getDay()+6)%7));
  let week = 0; for (let i=0;i<7;i++) if (byDay[addDays(mon,i)]) week++;
  $("stStreak").textContent = streak; $("stWeek").textContent = week; $("stTotal").textContent = count ?? data.length;
  // 12週間のカレンダー（月曜はじまり）
  const start = addDays(mon, -7*11); let cells = "";
  for (let i=0;i<84;i++) { const k = addDays(start,i); const n = byDay[k]||0; const future = k > today();
    cells += `<i class="${n>=3?"l3":n==2?"l2":n==1?"l1":""} ${k===today()?"today":""}" style="${future?"opacity:.25":""}" title="${k}"></i>`; }
  $("heat").innerHTML = cells;
  $("logList").innerHTML = data.length ? data.slice(0,40).map(s => `<div class="item" data-id="${s.id}"><div class="t"><b>${MODE_JA[s.mode]}　${esc(s.scene||"")}</b>
      <small>${new Date(s.created_at).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}・${s.minutes??"-"}分</small></div>
      ${s.score!=null?`<span class="tag ${s.score>=85?"ok":""}">${Math.round(s.score)}${s.mode==="conversation"?"点":"%"}</span>`:""}</div>`).join("")
    : `<p class="hint">まだ記録がありません。</p>`;
  $("logList").querySelectorAll("[data-id]").forEach(el => el.onclick = () => openLog(el.dataset.id));
}
async function openLog(id) {
  const { data:s } = await sb.from("ek_sessions").select("*").eq("id", id).single(); if (!s) return;
  const b = $("logBody");
  const head = `<div class="row"><h3 class="grow">${MODE_JA[s.mode]}　${esc(s.scene||"")}</h3><button class="sm" id="lgClose">閉じる</button></div>

  } else b.innerHTML = head + `<p>${s.score!=null?`正解率 ${s.score}%`:""}</p>`;

  $("pointBox").classList.add("hidden"); $("quizBox").classList.add("hidden"); $("todayBox").classList.remove("hidden");
  const box = $("todayBox");
  if (!course) { box.innerHTML = `<p class="hint">読み込み中…</p>`; if (!(await loadCourse())) return; }
  if (course.week > COURSE.length) {
    box.innerHTML = `<div class="flash"><div class="big">🎉</div><p>全${COURSE.length}週を修了しました！</p><p class="hint">カリキュラムから好きな週を選んで、もう一周できます。</p></div>`;
    return;
  }
  const w = weekOf(), key = `${course.week}-${course.day}`;
  const prog = ((course.week-1)*5 + (course.day-1)) / (COURSE.length*5) * 100;
  const lvName = LEVELS.find(l=>l.id===w.lv)?.label || "";
  const first = course.week === 1 && course.day === 1 && !(course.log||[]).length && !Object.keys(course.done||{}).length;
  box.innerHTML = `
    ${first ? `<div class="card" style="background:var(--bluebg)"><b>ようこそ！</b><div class="hint" style="color:var(--fg);margin-top:4px">中学英語のやり直しから、旅行・仕事・TOEICまで全${COURSE.length}週のカリキュラムです。1日15〜20分、上から順にこなすだけ。1週間＝5日分なので、休んでも続きから始められます。易しすぎるときは右上の「カリキュラム」から週を飛ばせます。</div></div>` : ""}
    <div class="hint" style="margin-top:6px">${esc(STAGES[w.st])}</div>
    <h2 style="margin-top:4px">Week ${course.week}「${esc(w.t)}」　<span class="tag b">Day ${course.day} / 5</span></h2>
    <div class="hint">📘 ${esc(w.g)}<br>🎬 ${esc(w.sc)}<br>📶 レベル：${lvName}</div>
    <div class="progress"><div style="width:${prog}%"></div></div>
    <div class="hint" style="text-align:right">全体の ${Math.round(prog)}%</div>
    <div id="taskList"></div>`;
  if (course.lesson_key !== key || !course.lesson) {
    $("taskList").innerHTML = `<div class="card" style="text-align:center"><p>今日のレッスンを用意しています…</p><p class="hint">AIが今日の例文・練習文・会話・クイズを作っています（20秒ほど）</p></div>`;
    if (lessonLoading) return; lessonLoading = true;
    try {
      const d = await api("lesson", { title:w.t, grammar:w.g, scene:w.sc, level:w.lv, day:course.day, goal:GOAL });
      await saveCourse({ lesson:d, lesson_key:key, done:{} });
    } catch (e) { $("taskList").innerHTML = `<div class="card"><p>レッスンを作れませんでした：${esc(e.message)}</p><button id="lsRetry" class="primary">もう一度</button></div>`; $("lsRetry").onclick = renderToday; lessonLoading = false; return; }
    lessonLoading = false;
  }
  paintTasks();
}
async function paintTasks() {
  const list = DAY_TASKS[course.day] || DAY_TASKS[1], done = course.done || {};
  const { count:due } = await sb.from("ek_phrases").select("id", { count:"exact", head:true }).lte("next_review", today());
  const total = list.reduce((a,k)=>a+TASKS[k].min,0);
  const all = list.every(k => done[k]);
  let html = `<div class="hint" style="margin-top:10px">今日のメニュー（約${total}分）</div>`;
  list.forEach((k,i) => { const t = TASKS[k];
    html += `<button class="task ${done[k]?"done":""}" data-k="${k}"><span class="n">${done[k]?"✓":i+1}</span><span class="t"><b>${t.icon} ${t.label}</b><small>${taskNote(k)}・約${t.min}分</small></span><span>›</span></button>`; });
  if (due) html += `<button class="task ${done.phr?"done":""}" data-k="phr"><span class="n">${done.phr?"✓":"＋"}</span><span class="t"><b>📒 フレーズ帳の復習（おまけ）</b><small>今日の復習 ${due}件・約3分</small></span><span>›</span></button>`;
  if (all) html += `<div class="card" style="text-align:center;margin-top:16px"><div class="big">🎉</div><p><b>今日のメニュー完了！</b></p>
      <p class="hint">${course.day < 5 ? "続けて次の日に進むこともできます。" : "今週のまとめまで終わりました。次は新しい週です。"}</p>
      <button class="primary" id="nextDay" style="padding:12px 24px">${course.day < 5 ? `Day ${course.day+1} へ進む` : `Week ${course.week+1} へ進む`}</button></div>`;
  $("taskList").innerHTML = html;
  $("taskList").querySelectorAll("[data-k]").forEach(b => b.onclick = () => runTask(b.dataset.k));
  if ($("nextDay")) $("nextDay").onclick = async () => {
    const log = [...(course.log||[]), { date:today(), week:course.week, day:course.day }].slice(-300);
    const nx = course.day < 5 ? { week:course.week, day:course.day+1 } : { week:course.week+1, day:1 };
    await saveCourse({ ...nx, done:{}, lesson:null, lesson_key:null, log });
    await sb.from("ek_sessions").insert({ mode:"lesson", scene:`Week${log.at(-1).week} Day${log.at(-1).day}「${COURSE[log.at(-1).week-1].t}」`, minutes:total, data:{} });
    window.scrollTo(0,0); renderToday();
  };
}
function taskNote(k) {
  const L = course.lesson || {};
  return { point: L.point_title || "今日の文法・表現", dict: `練習文${(L.sentences||[]).length}文を書き取る`, shad: `練習文${(L.sentences||[]).length}文をまねして言う`,
    quiz: `${(L.quiz||[]).length}問・聞いて正しい応答を選ぶ`, talk: L.roleplay_ja || "ロールプレイ", phr:"" }[k] || "";
}
function runTask(k) {
  const L = course.lesson, w = weekOf(), title = `Week${course.week} Day${course.day}「${w.t}」`;
  if (k === "point") return showPoint();
  if (k === "quiz") return startQuiz();
  courseTask = k;
  if (k === "dict") { show("dict"); startDict({ title, sentences:L.sentences }); }
  if (k === "shad") { show("shad"); startShad({ title, sentences:L.sentences }); }
  if (k === "talk") { show("talk"); startTalkWith({ name:title, text:L.roleplay_en, level:w.lv, mission:L.roleplay_ja }); }
  if (k === "phr") { show("phr"); loadPhrases().then(() => $("phrReview").onclick()); }
}
// 今日のポイント
function showPoint() {
  const L = course.lesson;
  $("todayBox").classList.add("hidden"); $("pointBox").classList.remove("hidden"); window.scrollTo(0,0);
  $("pointBox").innerHTML = `<div class="row"><button class="sm" id="ptBack">‹ もどる</button></div>
    <h2>💡 ${esc(L.point_title)}</h2>
    <div class="card" style="line-height:1.8">${esc(L.point_ja).replace(/\n/g,"<br>")}</div>
    <h2>例文</h2>
    ${L.examples.map((x,i)=>`<div class="item"><div class="t"><b>${esc(x.en)}</b><small>${esc(x.ja)}</small></div><button class="sm" data-p="${i}">🔊</button><button class="sm" data-s="${i}">🐢</button></div>`).join("")}
    <p class="hint">声に出して、まねして3回ずつ言ってみましょう。</p>
    <div class="row" style="margin-top:12px"><button class="primary grow" id="ptOk" style="padding:12px">わかった（例文をフレーズ帳へ）</button></div>`;
  $("pointBox").querySelectorAll("[data-p]").forEach(b => b.onclick = () => speak(L.examples[+b.dataset.p].en));
  $("pointBox").querySelectorAll("[data-s]").forEach(b => b.onclick = () => speak(L.examples[+b.dataset.s].en, S.slow));
  $("ptBack").onclick = renderToday;
  $("ptOk").onclick = async () => {
    $("ptOk").disabled = true;
    const ens = L.examples.map(x=>x.en);
    const { data:have } = await sb.from("ek_phrases").select("en").in("en", ens);
    const rows = L.examples.filter(x => !(have||[]).some(h=>h.en===x.en)).map(x => ({ en:x.en, ja:x.ja, note:L.point_title, scene:weekOf().t }));
    if (rows.length) await sb.from("ek_phrases").insert(rows);
    await markDone("point"); toast("フレーズ帳に入れました"); renderToday();
  };
}
// TOEIC Part 2 形式クイズ
let qz = null;
function startQuiz() {
  qz = { list:course.lesson.quiz || [], i:0, ok:0, at:Date.now(), show:false };
  $("todayBox").classList.add("hidden"); $("quizBox").classList.remove("hidden"); paintQuiz();
}
async function playQuiz(q) {
  await speak(q.q); for (let i=0;i<3;i++) { await new Promise(r=>setTimeout(r,500)); if (!qz || qz.cur !== q) return; await speak(`${"ABC"[i]}. ${q.choices[i]}`); }
}
function paintQuiz() {
  const q = qz.list[qz.i]; window.scrollTo(0,0);
  if (!q) {
    const sc = qz.list.length ? Math.round(qz.ok/qz.list.length*100) : 0;
    $("quizBox").innerHTML = `<div class="flash"><div class="big">${qz.ok} / ${qz.list.length}</div><p>クイズおわり！</p><button class="primary" id="qzBack">今日のメニューへ</button></div>`;
    $("qzBack").onclick = renderToday;
    markDone("quiz");
    sb.from("ek_sessions").insert({ mode:"quiz", scene:`Week${course.week} Day${course.day}`, minutes:Math.max(1,Math.round((Date.now()-qz.at)/60000)), score:sc, data:{ list:qz.list } });
    return;
  }
  qz.cur = q; qz.answered = false;
  $("quizBox").innerHTML = `<div class="row"><button class="sm" id="qzQuit">‹ もどる</button><span class="grow"></span><span class="tag">${qz.i+1} / ${qz.list.length}</span></div>
    <h2>🎧 問題を聞いて、いちばん自然な応答を選ぶ</h2>
    <div class="hint">TOEIC Part 2 と同じ形式です。最初は文字を隠して、耳だけで挑戦してみましょう。</div>
    <div class="player"><button class="blue" id="qzPlay">▶ 問題を聞く</button><button id="qzSlow">🐢</button></div>
    <label style="display:flex;gap:8px;align-items:center;color:var(--fg)"><input type="checkbox" id="qzShow" style="width:auto" ${qz.show?"checked":""}> 文字を表示する</label>
    <div class="card ${qz.show?"":"hidden"}" id="qzQ" style="font-size:17px">${esc(q.q)}</div>
    <div id="qzOpts">${q.choices.map((c,i)=>`<button class="qopt" data-i="${i}"><b>(${"ABC"[i]})</b><span class="grow qtext ${qz.show?"":"hidden"}">${esc(c)}</span></button>`).join("")}</div>
    <div id="qzAns" class="hidden card"></div>`;
  $("qzPlay").onclick = () => playQuiz(q);
  $("qzSlow").onclick = async () => { await speak(q.q, S.slow); for (let i=0;i<3;i++){ await new Promise(r=>setTimeout(r,400)); if (qz.cur!==q) return; await speak(`${"ABC"[i]}. ${q.choices[i]}`, S.slow);} };
  $("qzShow").onchange = e => { qz.show = e.target.checked; $("qzQ").classList.toggle("hidden", !qz.show); document.querySelectorAll(".qtext").forEach(x=>x.classList.toggle("hidden", !qz.show)); };
  $("qzQuit").onclick = () => { stopAudio(); qz = null; renderToday(); };
  document.querySelectorAll("#qzOpts .qopt").forEach(b => b.onclick = () => {
    if (qz.answered) return; qz.answered = true; stopAudio();
    const pick = +b.dataset.i, ok = pick === q.answer; if (ok) qz.ok++;
    document.querySelectorAll("#qzOpts .qopt").forEach((x,i) => { if (i===q.answer) x.classList.add("ok"); else if (i===pick) x.classList.add("ng"); });
    $("qzQ").classList.remove("hidden"); document.querySelectorAll(".qtext").forEach(x=>x.classList.remove("hidden"));
    $("qzAns").classList.remove("hidden");
    $("qzAns").innerHTML = `<b>${ok?"⭕ 正解！":"❌ ざんねん"}</b><p class="ja2" style="line-height:1.7">${esc(q.ja)}</p>
      <div class="row"><button class="sm" id="qzAgain">🔊 もう一度聞く</button><span class="grow"></span><button class="primary" id="qzNext">${qz.i < qz.list.length-1 ? "次へ" : "結果を見る"}</button></div>`;
    $("qzAgain").onclick = () => playQuiz(q);
    $("qzNext").onclick = () => { stopAudio(); qz.i++; paintQuiz(); };
  });
  setTimeout(() => playQuiz(q), 300);
}
// カリキュラム一覧
$("cOpenList").onclick = async () => {
  if (!course && !(await loadCourse())) return;
  let html = `<div class="row"><h3 class="grow">カリキュラム（全${COURSE.length}週）</h3><button class="sm" id="clClose">閉じる</button></div>
    <p class="hint">1週＝5日分（1日15〜20分）。易しすぎ・難しすぎるときは、週を選んでそこから始められます。</p>`;
  let st = 0;
  COURSE.forEach((w,i) => {
    if (w.st !== st) { st = w.st; html += `<div class="stage">${esc(STAGES[st])}</div>`; }
    const n = i+1, cur = n === course.week, fin = n < course.week;
    html += `<div class="wk ${cur?"cur":""}" data-w="${n}"><span class="no">${fin?"✅":cur?"▶︎":""} W${n}</span><span class="grow"><b>${esc(w.t)}</b><br><small class="hint">${esc(w.g)}</small></span></div>`;
  });
  $("courseBody").innerHTML = html; $("courseDlg").showModal();
  $("clClose").onclick = () => $("courseDlg").close();
  $("courseBody").querySelectorAll("[data-w]").forEach(el => el.onclick = async () => {
    const n = +el.dataset.w; if (n === course.week) return $("courseDlg").close();
    if (!confirm(`Week ${n}「${COURSE[n-1].t}」の Day 1 から始めますか？`)) return;
    await saveCourse({ week:n, day:1, done:{}, lesson:null, lesson_key:null }); $("courseDlg").close(); show("today");
  });
};

// ===== ログイン・起動 =====
$("loginForm").onsubmit = async e => {
  e.preventDefault(); $("lBtn").disabled = true; $("lMsg").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email:$("lEmail").value.trim(), password:$("lPass").value });
  $("lBtn").disabled = false;
  if (error) { $("lMsg").textContent = "ログインできませんでした：" + error.message; return; }
  $("lPass").value = ""; show("today"); loadRate();
};
document.addEventListener("visibilitychange", () => { if (document.hidden && recState) recStop(); });
(async () => { const t = await token(); show(t ? "today" : "login"); if (t) loadRate(); })();
</script>
